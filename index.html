<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Light Handler</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }

            #game-container {
                width: 100%;
                height: 100%;
            }

            /*
             * The game draws its pixel art at 4x, so the canvas itself can be scaled smoothly.
             * Nearest-neighbour scaling to a window that is not an exact multiple drops whole
             * pixel columns, which closes up letters like "c" and makes the text unreadable.
             */
            #game-container canvas {
                image-rendering: auto !important;
            }
        </style>
    </head>
    <body>
        <div id="game-container"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
